[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skp-ballet"
version = "0.1.0"
description = "Read-only SketchUp (.skp) reader, GLB export and viewer"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
skp-ballet = "skpballet.cli:main"

[tool.setuptools]
packages = ["skpballet"]
package-data = { skpballet = ["web/*.html"] }
